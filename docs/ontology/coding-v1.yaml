# GMR coding-domain ontology, version 1.
# A memory is an instance that fills a declared slot of a declared entity with a declared source.
# Information that fills no slot is not written. A node holds present values only; the path is in the journal.

ontology: gmr-coding
version: 1

# Every property value and every relation instance carries these three, whoever writes it.
provenance:
  author: [human, agent]            # agent = the task-doing model, signed with its task id
  source:
    - user-said                     # the owner or a user stated it
    - observed: fact_address        # read from reality through a probe; the address is the reading
    - decided: person               # a human judgment; rationale required
    - reviewed: commit              # written by an agent, accepted by a human in a commit
  at: timestamp

entities:

  Module:
    key: path                       # crate, package, or directory with a manifest
    slots:
      role:      {type: text, source: [observed, reviewed], one_sentence: true}
      boundary:  {type: text, source: [decided, reviewed], one_sentence: true}   # what it may hold and may not

  File:
    key: path
    slots: {}

  Function:
    key: path#name(shape)           # shape = the signature form the ast-map probe reports
    slots:
      purpose:   {type: text, source: [observed, reviewed], one_sentence: true}
      contract:  {type: text, source: [observed, reviewed], one_sentence: true}   # inputs, outputs, effects as a promise
      fails_by:  {type: text, source: [observed, reviewed], one_sentence: true}

  Type:
    key: path#name
    slots:
      means:     {type: text, source: [observed, reviewed], one_sentence: true}
      invariant: {type: text, source: [decided, reviewed], one_sentence: true}   # what must stay true of every value

  Field:
    key: path#Type.name
    slots:
      means:     {type: text, source: [observed, reviewed], one_sentence: true}
      unit:      {type: text, source: [observed, reviewed], one_sentence: true}

  Format:
    key: name                       # a data shape that crosses a boundary: a file line, a message, a JSON body
    slots:
      shape:     {type: text, source: [observed, reviewed], one_sentence: true}

  Endpoint:
    key: method path
    slots:
      contract:  {type: text, source: [observed, reviewed], one_sentence: true}

  Table:
    key: db.table
    slots:
      means:     {type: text, source: [observed, reviewed], one_sentence: true}

  Config:
    key: path#key
    slots:
      controls:  {type: text, source: [observed, reviewed], one_sentence: true}

  Test:
    key: path#name
    slots:
      proves:    {type: text, source: [observed, reviewed], one_sentence: true}

  Policy:                           # a rule that must hold; written by a person
    key: id
    slots:
      claim:           {type: text, source: [decided], one_sentence: true, required: true}
      rationale:       {type: text, source: [decided], required: true}
      enforcement:     {type: enum, values: [mechanical, review], required: true}
      review_question: {type: text, one_sentence: true}   # what to reconsider when a governed entity goes stale
      valid_from:      {type: timestamp, required: true}

  Decision:                         # a judgment someone made about specific entities; written by a person
    key: id
    slots:
      claim:           {type: text, source: [decided], one_sentence: true, required: true}
      rationale:       {type: text, source: [decided], required: true}
      review_question: {type: text, one_sentence: true}
      valid_from:      {type: timestamp, required: true}

  Incident:
    key: id
    slots:
      what_happened:   {type: text, source: [decided, reviewed], required: true}

  Owner:
    key: handle
    slots: {}

  Claim:                            # a task-scoped conclusion; retired when its basis goes stale; never promoted silently
    key: task seq
    slots:
      text:      {type: text, source: [observed], required: true}
      task:      {type: id, required: true}

relations:                          # (kind, from, to) is the identity; each instance carries provenance and an optional reason
  calls:            {from: Function,                 to: Function}
  imports:          {from: [Module, File],           to: Module}
  contains:         {from: [Module, File, Type],     to: [File, Function, Type, Field, Test]}
  implements:       {from: Type,                     to: Type}
  produces:         {from: [Function, Module],       to: Format}
  consumes:         {from: [Function, Module],       to: Format}
  reads:            {from: Function,                 to: [Config, Table, Field]}
  exposes:          {from: Module,                   to: Endpoint}
  verified_by:      {from: [Function, Type, Format, Policy, Decision], to: Test}
  governed_by:      {from: [Module, File, Function, Type, Field, Format, Endpoint, Table, Config], to: Policy}
  decided_by:       {from: [Module, File, Function, Type, Field, Format, Endpoint, Table, Config], to: Decision}
  must_change_with: {from: any, to: any, symmetric: true, reason: required}
  caused:           {from: Incident,                 to: [Policy, Decision]}
  owned_by:         {from: Module,                   to: Owner}
  supersedes:       {from: [Policy, Decision, Claim], to: same_kind}
  contradicts:      {from: [Claim, Decision, Policy], to: [Claim, Decision, Policy], symmetric: true}
  rests_on:         {from: [Claim, Decision, Policy], to: [fact_address, any]}

# Action signatures are the closure rules: what enter(action, entity) reads.
actions:
  modify:
    entity: [Function, Type, Field, Format, Config, Endpoint, Table]
    reads:
      - self.slots
      - calls⁻¹ | reads⁻¹ | consumes⁻¹ | implements⁻¹            # who depends on it
      - produces | consumes -> Format -> consumes⁻¹ | produces⁻¹  # the other side of every format it touches
      - reads -> Config | Table | Field
      - governed_by, and governed_by of every contains⁻¹ ancestor
      - decided_by
      - verified_by
      - must_change_with
      - caused⁻¹ open Incidents
      - Claims with rests_on self, standing holds
      - contradicts among everything above
    probe: [callers(self), tests(self), build(ancestor Module)]   # read now, delivered, never stored as edges by the system

  extend:
    entity: [Module, Type]
    reads:
      - self.slots
      - contains -> members, their slots                          # the shape a new member must match
      - governed_by, and governed_by of ancestors
      - must_change_with                                          # registration points
      - decided_by
    probe: [members(self), build(self)]

  explain:
    entity: any
    reads:
      - self.slots
      - decided_by -> rationale
      - governed_by -> claim, rationale
      - rests_on one hop
      - contradicts

  verify:
    entity: [Claim, Decision, Policy]
    reads:
      - rests_on -> fact_address, compared with the current reading
      - contradicts
      - supersedes⁻¹

  debug:
    entity: symptom                                               # locate first; not a closure, a ranked set of suspects
    reads:
      - for each candidate: self.slots, must_change_with, decided_by
      - entities whose readings changed most recently within two hops
    probe: [tests(candidate), callers(candidate)]

# What is never written as memory. Each has a home elsewhere.
not_memory:
  - the ontology's own knowledge, such as which types exist or that a Test is a File   # this file
  - anything a probe reads: what code does line by line, signatures, current values    # readings
  - how a fact was discovered, what it used to be, what was wrong before               # journal
  - what another node says                                                             # an edge to that node
  - a measurement taken on one day                                                     # a reading's snapshot
  - an agent's inference without an observed or stated source                          # a Claim, at most
